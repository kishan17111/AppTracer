      - name: Add OTP lock server
        env:
          S: ${{ secrets.LOCK_SERVER }}
        run: |
          mkdir -p app/src/main/assets
          printf '%s' "$S" > app/src/main/assets/lock.cfg
      - name: Build debug APK
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log || { { echo '```'; grep -m1 -A25 'What went wrong' build.log || tail -40 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AppTrace.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apptrace-${{ github.run_number }}
          name: AppTrace build ${{ github.run_number }}
          files: AppTrace.apk
          
